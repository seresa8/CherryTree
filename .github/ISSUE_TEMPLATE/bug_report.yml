name: Bug report
description: Something in Cherry Tree isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Cherry Tree version
      placeholder: e.g. 3.9.1
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: e.g. 6.7
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.3
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, other active plugins, etc.
